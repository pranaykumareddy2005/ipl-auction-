<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL Auction 2026 — Live</title>
<link rel="stylesheet" href="app.css">
<style>
  body{overflow:hidden}
  .stage{height:100vh;display:grid;grid-template-rows:auto 1fr auto auto;gap:0}
  /* coming-up ticker */
  .ticker{display:flex;align-items:center;gap:0;border-top:1px solid var(--line);background:#0a1122;overflow:hidden}
  .ticker .lead{flex:none;display:flex;align-items:center;gap:8px;padding:10px 18px;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#20160a;
    font-family:var(--f-head);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px}
  .ticker .track{flex:1;overflow:hidden;white-space:nowrap;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
  .ticker .move{display:inline-block;padding-left:100%;animation:marq 32s linear infinite}
  .ticker .item{display:inline-flex;align-items:baseline;gap:8px;margin:0 26px;font-family:var(--f-head);font-size:17px}
  .ticker .item b{color:var(--ink);font-weight:600} .ticker .item .b{color:var(--gold);font-weight:600}
  .ticker .item .r{color:var(--dim);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
  @keyframes marq{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  .top{display:flex;align-items:center;justify-content:space-between;padding:18px 30px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(13,20,40,.85),transparent);position:relative;z-index:2}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(245,197,66,.5),rgba(90,210,255,.4),transparent)}
  .mid{display:grid;grid-template-columns:1.2fr .8fr;gap:26px;padding:26px 34px;min-height:0}
  .playercard{position:relative;border-radius:20px;padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;justify-content:center;gap:min(1.6vh,14px);
    border:1px solid var(--line);overflow:hidden;background:linear-gradient(160deg,var(--panel),var(--bg2))}
  .catbar{position:absolute;inset:0 auto 0 0;width:8px}
  .phototop{display:flex;align-items:center;gap:clamp(14px,1.6vw,20px)}
  .pphoto{width:clamp(84px,8.5vw,120px);height:clamp(84px,8.5vw,120px);border-radius:16px;flex:none;object-fit:cover;border:2px solid var(--line);
    background:#0d1428;display:grid;place-items:center;overflow:hidden}
  .pphoto img{width:100%;height:100%;object-fit:cover}
  .pavatar{width:100%;height:100%;display:grid;place-items:center;font-size:40px;font-weight:900;color:#0a0e1a}
  .pavatar.sil{opacity:.6}
  /* broadcast-style glowing rotating halo around the player */
  .halo{position:relative;display:grid;place-items:center;flex:none;
    width:clamp(118px,13vw,188px);height:clamp(118px,13vw,188px)}
  .halo .pphoto{width:66%;height:66%;border-radius:50%;border:none;position:relative;z-index:2;
    background:linear-gradient(160deg,#12203f,#0a1020);
    box-shadow:0 0 0 3px rgba(11,17,32,.9),0 0 0 5px rgba(245,197,66,.55),
      0 0 34px rgba(90,210,255,.35),0 14px 40px rgba(0,0,0,.55)}
  .halo .pphoto img{border-radius:50%}
  .halo .hring{position:absolute;border-radius:50%;pointer-events:none}
  .halo .r1{inset:0;border:2px dashed rgba(90,210,255,.55);
    box-shadow:0 0 20px rgba(90,210,255,.22),inset 0 0 20px rgba(90,210,255,.15);animation:spin 18s linear infinite}
  .halo .r2{inset:8%;border:2px dotted rgba(245,197,66,.6);animation:spin 12s linear infinite reverse}
  .halo .r3{inset:-6%;animation:spin 7s linear infinite;filter:blur(.4px);
    background:conic-gradient(from 0deg,transparent 0 55deg,rgba(90,210,255,.65) 75deg,transparent 95deg 235deg,rgba(245,197,66,.65) 255deg,transparent 275deg);
    -webkit-mask:radial-gradient(closest-side,transparent 79%,#000 81%);mask:radial-gradient(closest-side,transparent 79%,#000 81%)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .lastside{margin-top:8px;color:var(--mut);font-family:var(--f-head);font-size:clamp(12px,1.1vw,15px);letter-spacing:.5px}
  .lastside b{color:var(--gold)}
  .pname{font-family:var(--f-head);font-size:clamp(26px,3.4vw,54px);font-weight:700;line-height:.98;margin:4px 0;text-wrap:balance;text-transform:uppercase;letter-spacing:.5px}
  #pcode{font-size:clamp(11px,1vw,14px)}
  .pmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .pmeta .tag{font-size:clamp(11px,1vw,14px);padding:4px 10px}
  .hl{margin-top:min(1.4vh,12px);display:flex;flex-direction:column;gap:min(1vh,8px)}
  .hl div{color:var(--mut);font-size:clamp(13px,1.25vw,17px);display:flex;gap:9px;align-items:center;line-height:1.25}
  .hl div::before{content:"▸";color:var(--gold);flex:none}
  /* ===== broadcast lower-third ===== */
  .mid{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
  /* soft stage spotlight sitting behind the player photo — makes the halo pop */
  .mid::before{content:"";position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);
    width:min(120vh,900px);height:min(120vh,900px);pointer-events:none;z-index:0;
    background:radial-gradient(circle,rgba(90,210,255,.16),rgba(90,210,255,.05) 42%,transparent 68%)}
  .bcast{position:relative;z-index:1}
  .cornerTimer{position:absolute;top:6px;right:22px;text-align:center;z-index:4}
  .cornerTimer .ring{width:clamp(74px,9vh,108px);height:clamp(74px,9vh,108px)}
  .cornerTimer .ring b{font-size:clamp(28px,4.4vh,42px)}
  .cornerTimer .ctlbl{font-family:var(--f-head);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-top:2px}
  .bcast{display:flex;flex-direction:column;align-items:center;width:min(1080px,94vw)}
  .halo.big{width:clamp(150px,22vh,250px);height:clamp(150px,22vh,250px);margin-bottom:clamp(-54px,-5.5vh,-34px);z-index:3}
  .bcbar{display:grid;grid-template-columns:1fr 1.6fr 1fr;width:100%;border-radius:18px;overflow:hidden;
    border:1px solid rgba(90,210,255,.35);background:linear-gradient(180deg,#0e2338,#081729);
    box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 40px rgba(90,210,255,.14),inset 0 1px 0 rgba(255,255,255,.05)}
  .bcpanel{padding:clamp(14px,2vh,22px) clamp(12px,1.5vw,24px);text-align:center;position:relative;min-width:0}
  .bcpanel.center{padding-top:clamp(50px,6.5vh,72px);background:rgba(8,22,40,.55);
    border-left:1px solid rgba(90,210,255,.22);border-right:1px solid rgba(90,210,255,.22)}
  .bcpanel.right{background:linear-gradient(180deg,rgba(245,197,66,.10),rgba(245,197,66,.02))}
  .bck{font-family:var(--f-head);font-size:clamp(11px,1.15vw,15px);letter-spacing:2px;text-transform:uppercase;color:#7fb6d6}
  .bcv{font-family:var(--f-display);font-size:clamp(26px,3.8vw,54px);line-height:1;margin-top:4px;font-variant-numeric:tabular-nums;transition:transform .18s ease}
  .bcv.bump{transform:scale(1.06)}
  .bcv.gold{background:linear-gradient(120deg,#fff 20%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 14px rgba(245,197,66,.35))}
  .bcpanel.center .pname{font-size:clamp(22px,3vw,46px);margin:0}
  .bcpanel.center .pmeta{justify-content:center;margin-top:8px}
  .bcpanel.center .catbar{display:none}
  .leadmini{font-family:var(--f-head);font-size:clamp(12px,1.2vw,16px);color:var(--gold);margin-top:6px;text-transform:uppercase;letter-spacing:.5px;min-height:1.1em}
  .statstrip{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#0b1a30}
  .statstrip .cell{padding:7px 16px;font-family:var(--f-head);border-right:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
  .statstrip .cell:last-child{border-right:none}
  .statstrip .cell .k{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#7fb6d6}
  .statstrip .cell .v{font-size:clamp(13px,1.3vw,17px);color:var(--ink);font-weight:600}
  .bcast .hl{align-items:center;margin-top:12px}
  .bcast .lastside{text-align:center}
  .bidside{display:flex;flex-direction:column;gap:20px;min-height:0}
  .bidbox{border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,#141d3e,#0e1430);
    padding:26px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center}
  .bidlabel{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--mut);font-weight:800}
  .bidamt{font-family:var(--f-display);font-size:clamp(52px,8vw,120px);line-height:.92;margin:6px 0;
    background:linear-gradient(120deg,#fff 20%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
    transition:transform .18s ease}
  .bidamt.bump{transform:scale(1.06)}
  .leadteam{font-family:var(--f-head);font-size:clamp(22px,3vw,42px);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .base{color:var(--dim);font-size:16px;margin-top:6px}
  .timerwrap{display:flex;align-items:center;justify-content:center;gap:16px}
  .ring{--p:0;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--gold) calc(var(--p)*1%), #1a2344 0);position:relative}
  .ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--bg2)}
  .ring b{position:relative;font-family:var(--f-display);font-size:46px}
  .bidamt, .bidlabel{font-variant-numeric:tabular-nums}
  .teams{display:flex;gap:12px;padding:16px 26px 22px;overflow-x:auto;border-top:1px solid var(--line);
    background:linear-gradient(180deg,transparent,rgba(9,13,26,.6))}
  .tcard{min-width:158px;flex:1;border-radius:14px;border:1px solid var(--line);padding:12px 15px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--panel),var(--bg2));transition:border-color .2s,box-shadow .2s,transform .2s}
  .tcard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--tc,transparent)}
  .tcard.lead{border-color:var(--gold);box-shadow:0 0 0 1px rgba(244,196,48,.5),0 0 22px rgba(244,196,48,.22);transform:translateY(-2px)}
  .tcard .tn{font-family:var(--f-head);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;letter-spacing:.3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tcard .swatch{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 8px currentColor}
  .tcard .rem{font-family:var(--f-display);font-size:24px;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1;
    background:linear-gradient(120deg,#fff 30%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tcard .sub{font-size:11px;color:var(--mut);margin-top:4px}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:5}
  .overlay .big{font-size:clamp(40px,7vw,90px);font-weight:900}
  .sold-flash{animation:flash .8s ease}
  @keyframes flash{0%{transform:scale(.9);opacity:0}50%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}

  /* SOLD splash */
  .soldsplash{position:fixed;inset:0;z-index:80;display:none;place-items:center;text-align:center;
    background:radial-gradient(1000px 700px at 50% 40%, rgba(20,30,70,.96), rgba(4,7,16,.99))}
  .soldsplash.show{display:grid;animation:pop .4s ease}
  @keyframes pop{0%{opacity:0}100%{opacity:1}}
  /* the whole stack sizes to min(vw,vh) so it always fits the screen, any aspect */
  .soldsplash .inner{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:min(1.8vh,14px);max-height:100vh;padding:min(3vh,22px) 16px}
  .soldsplash .stamp{font-family:var(--f-display);font-size:min(12vw,13vh);letter-spacing:4px;line-height:1;
    color:var(--green);text-shadow:0 0 40px currentColor;transform:rotate(-5deg);
    border:6px solid currentColor;border-radius:16px;padding:.04em .34em;animation:stamp .5s cubic-bezier(.2,1.4,.4,1)}
  .soldsplash .stamp.unsold{color:var(--red)}
  .soldsplash .stamp.skipped{color:var(--gold)}
  .soldsplash .sp-sub{font-size:min(3.2vw,3.4vh);color:var(--mut);font-weight:800}
  @keyframes stamp{0%{transform:rotate(-5deg) scale(1.6);opacity:0}60%{transform:rotate(-5deg) scale(.94)}100%{transform:rotate(-5deg) scale(1);opacity:1}}
  .soldsplash .sp-name{font-family:var(--f-head);font-weight:700;font-size:min(5.6vw,6vh);line-height:1;text-transform:uppercase;text-wrap:balance}
  .soldsplash .sp-to{font-size:min(2.2vw,2.4vh);color:var(--mut);letter-spacing:3px;text-transform:uppercase;font-weight:800}
  .soldsplash .sp-team{font-family:var(--f-head);font-weight:600;font-size:min(4.6vw,5vh);line-height:1;text-transform:uppercase}
  .soldsplash .sp-price{font-family:var(--f-display);font-size:min(9vw,10vh);line-height:1;
    background:linear-gradient(120deg,#fff 20%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  #sp-photo{border-radius:50%;border:none;overflow:hidden;
    box-shadow:0 0 0 4px rgba(11,17,32,.9),0 0 0 6px rgba(245,197,66,.6),0 0 40px rgba(90,210,255,.3),0 16px 44px rgba(0,0,0,.6)}
  #sp-photo img{border-radius:50%}
</style>
</head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand"><div class="logo">IPL</div><div><small>Live Auction · 2026</small>
      <div id="round" style="font-weight:800">Main Round</div></div></div>
    <div class="row center" style="gap:16px">
      <button id="sndBtn" class="btn sm ghost" onclick="toggleSound()">🔇 Sound off</button>
      <div id="progress" class="mut" style="font-weight:700"></div>
      <span id="phase" class="pill setup"><span class="dot"></span><span id="phaseText">Setup</span></span>
    </div>
  </div>

  <div class="mid" id="mid">
    <div class="cornerTimer"><div class="ring" id="ring"><b id="ringnum">—</b></div><div class="ctlbl">on the clock</div></div>
    <div class="bcast">
      <div class="halo big">
        <span class="hring r3"></span><span class="hring r1"></span><span class="hring r2"></span>
        <div class="pphoto" id="pphoto"><div class="pavatar" id="pavatar">🏏</div></div>
      </div>
      <div class="bcbar">
        <div class="bcpanel side">
          <div class="bck">Base Price</div>
          <div class="bcv" id="baseVal">—</div>
        </div>
        <div class="bcpanel center">
          <div class="catbar" id="catbar"></div>
          <div class="pname" id="pname">Waiting for the next player…</div>
          <div class="pmeta" id="pmeta"></div>
        </div>
        <div class="bcpanel side right">
          <div class="bck">Current Bid</div>
          <div class="bcv gold" id="bidamt">—</div>
          <div class="leadmini" id="leadteam"></div>
        </div>
      </div>
      <div class="statstrip" id="statStrip"></div>
      <div class="hl" id="hl"></div>
      <div class="lastside" id="lastside"></div>
    </div>
  </div>

  <div class="ticker" id="ticker">
    <div class="lead">▸ Coming up</div>
    <div class="track"><div class="move" id="tickerMove"></div></div>
  </div>

  <div class="teams" id="teams"></div>
</div>

<div class="soldsplash" id="soldsplash">
  <div class="inner">
    <div class="stamp" id="sp-stamp">SOLD</div>
    <div class="pphoto" id="sp-photo" style="width:min(16vh,150px);height:min(16vh,150px);margin:0"></div>
    <div class="sp-name" id="sp-name"></div>
    <div class="sp-to" id="sp-to">sold to</div>
    <div class="sp-team" id="sp-team"></div>
    <div class="sp-price" id="sp-price"></div>
    <div class="sp-sub" id="sp-sub"></div>
  </div>
</div>

<script src="bus.js"></script>
<script>
const $=id=>document.getElementById(id);
let snap=null;

// ===== Sound effects — synthesized with Web Audio (no files, works offline) =====
let AC=null, sndOn=false, master=null;
function initAudio(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
}
function tone(freq,start,dur,type,vol){
  const t0=AC.currentTime+start, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(start,dur,vol,cut){
  const t0=AC.currentTime+start, n=AC.createBufferSource();
  const buf=AC.createBuffer(1,Math.max(1,AC.sampleRate*dur),AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  n.buffer=buf; const g=AC.createGain(); g.gain.value=vol||0.4;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||1600;
  n.connect(f); f.connect(g); g.connect(master); n.start(t0);
}
const SFX={
  bid(){ if(!sndOn||!AC)return; tone(880,0,0.07,'triangle',0.22); tone(1320,0.045,0.11,'triangle',0.18); },
  sold(){ if(!sndOn||!AC)return;                       // gavel knock ×2, then a bright fanfare
    noise(0,0.10,0.7,1200); tone(150,0.01,0.16,'square',0.5);
    noise(0.14,0.10,0.7,1200); tone(150,0.15,0.16,'square',0.5);
    [523,659,784,1047].forEach((f,i)=>tone(f,0.42+i*0.09,0.55,'triangle',0.24)); },
  unsold(){ if(!sndOn||!AC)return; tone(320,0,0.22,'sawtooth',0.32); tone(200,0.2,0.42,'sawtooth',0.3); },
  skip(){ if(!sndOn||!AC)return; tone(520,0,0.07,'sine',0.2); tone(390,0.08,0.1,'sine',0.16); },
  tick(){ if(!sndOn||!AC)return; tone(1000,0,0.04,'square',0.13); },
  hooter(){ if(!sndOn||!AC)return; tone(1500,0,0.35,'square',0.3); }
};
window.toggleSound=()=>{
  initAudio(); if(AC.state==='suspended') AC.resume();
  sndOn=!sndOn; try{ localStorage.setItem('ipl_snd', sndOn?'1':'0'); }catch(e){}
  const b=$('sndBtn'); b.textContent=sndOn?'🔊 Sound on':'🔇 Sound off'; b.className='btn sm '+(sndOn?'gold':'ghost');
  if(sndOn) SFX.bid();
};

function render(s){
  snap=s;
  const ph=s.phase;
  $('phase').className='pill '+ph;
  $('phaseText').textContent={setup:'Setup',live:'Live',paused:'Paused',complete:'Complete'}[ph]||ph;
  $('round').textContent=(s.round==='unsold'?'Unsold Round':'Main Round');
  $('progress').textContent=`Sold ${s.counts.sold} · Unsold ${s.counts.unsold} · Left ${s.counts.pool}`;

  const p=s.current;
  if(p){
    $('pname').textContent=p.name;
    const catColor='#'+((p.cat&&window.__cats&&window.__cats[p.cat])?window.__cats[p.cat].c:'888');
    $('catbar').style.background=catColor;
    $('baseVal').textContent=Bus.fmtL(p.base);
    const overseas=p.country && p.country!=='India';
    const meta=[];
    meta.push(`<span class="tag" style="background:${catColor}22;color:${catColor}">${roleLabel(p)}</span>`);
    if(p.country) meta.push(`<span class="tag" style="background:#20305f;color:#bcd">${Bus.esc(p.country)}</span>`);
    if(overseas) meta.push(`<span class="tag" style="background:rgba(77,141,255,.18);color:#85b0ff">Overseas</span>`);
    $('pmeta').innerHTML=meta.join('');
    $('lastside').innerHTML=(p.star&&p.star.team)?`Last IPL side · <b>${Bus.esc(p.star.team)}</b>`:'';
    setPhoto(p, catColor);
    // stats strip — real career stats when provided in the data, else player attributes
    const catLbl=(p.cat&&window.__cats&&window.__cats[p.cat])?window.__cats[p.cat].label:'';
    let cells;
    const st=p.stats;
    if(st && Object.keys(st).length){
      cells=[['CAREER','IPL']];
      if(st.matches!=null) cells.push(['MTS',st.matches]);
      if(st.runs!=null) cells.push(['RUNS',st.runs]);
      if(st.average!=null) cells.push(['AVG',st.average]);
      if(st.strike_rate!=null) cells.push(['SR',st.strike_rate]);
      if(st.wickets!=null) cells.push(['WKTS',st.wickets]);
      if(st.economy!=null) cells.push(['ECON',st.economy]);
    } else {
      cells=[['LOT',String(p.sr).padStart(3,'0')],['TYPE',catLbl],['ROLE',p.role||'—'],['FROM',p.country||'—'],['STATUS',p.cu||'—']];
    }
    $('statStrip').innerHTML=cells.map(c=>`<div class="cell"><span class="k">${Bus.esc(c[0])}</span><span class="v">${Bus.esc(c[1])}</span></div>`).join('');
    const hl=(p.star&&p.star.hi)?p.star.hi:[];
    $('hl').innerHTML=hl.map(h=>`<div>${Bus.esc(h)}</div>`).join('');
  } else {
    $('pname').textContent = ph==='complete'?'🏆 Auction Complete':(ph==='setup'?'Auction not started':'Waiting for the next player…');
    $('baseVal').textContent='—';
    $('pmeta').innerHTML=''; $('hl').innerHTML=''; $('lastside').innerHTML=''; $('statStrip').innerHTML=''; $('catbar').style.background='var(--line)';
    $('pphoto').innerHTML='<div class="pavatar sil" style="background:linear-gradient(160deg,#182352,#0d1428);color:#3a4a80">'+SIL+'</div>';
  }

  const b=s.bidding;
  if(b && b.currentBidL!=null){
    $('bidamt').textContent=Bus.fmtL(b.currentBidL);
    bumpBid(b.currentBidL);
    const lt=s.teams.find(t=>t.teamId===b.leadingTeamId);
    $('leadteam').textContent=lt?('🔨 '+lt.name):'';
  } else if(b){
    $('bidamt').textContent=Bus.fmtL(b.baseL);
    $('leadteam').textContent='Opening bid';prevBid=null;
  } else {
    $('bidamt').textContent='—';$('leadteam').textContent='';prevBid=null;
  }

  renderTeams(s);
  renderTicker(s);
  tick();
  checkResult(s);
}

let prevBid=null;
function bumpBid(v){ if(v!=null && v!==prevBid){ const el=$('bidamt'); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),200); SFX.bid(); } prevBid=v; }

function renderTicker(s){
  const q=s.queuePreview||[];
  const move=$('tickerMove');
  if(!q.length){ move.innerHTML=`<span class="item"><b>${s.phase==='complete'?'Auction complete — thank you!':'No more players queued'}</b></span>`; return; }
  const html=q.map(p=>`<span class="item"><b>${Bus.esc(p.name)}</b> <span class="r">${Bus.esc(p.role||'')}</span> <span class="b">${Bus.fmtL(p.base)}</span></span>`).join('');
  // duplicate so the marquee loops seamlessly
  move.innerHTML=html+html;
}

// Show a full-screen moment (SOLD / UNSOLD / SKIPPED) when a player is resolved,
// then auto-return to the auction view.
let lastResTs=0, splashT=null;
function checkResult(s){
  const r=s.lastResult;
  if(!r) return;
  // only fire for a genuinely new resolution, never on heartbeat/reopen replays
  if(r.ts===lastResTs) return;
  const fresh = (Date.now()-r.ts) < 8000;
  lastResTs=r.ts;
  if(!fresh) return;

  if(r.kind==='sold') SFX.sold(); else if(r.kind==='unsold') SFX.unsold(); else SFX.skip();
  const stamp=$('sp-stamp');
  const col = r.kind==='sold'?'#2ec46a':(r.kind==='unsold'?'#e63946':'#f4c430');
  stamp.className='stamp '+r.kind;
  stamp.textContent = r.kind==='sold'?'SOLD':(r.kind==='unsold'?'UNSOLD':'SKIPPED');
  fillPhoto($('sp-photo'), r.name, r.teamColor||col, r.photo);
  $('sp-name').textContent=r.name;

  const sold = r.kind==='sold';
  $('sp-to').style.display   = sold?'':'none';
  $('sp-team').style.display = sold?'':'none';
  $('sp-price').style.display= sold?'':'none';
  $('sp-sub').style.display  = sold?'none':'';
  if(sold){
    $('sp-team').textContent=r.teamName||''; $('sp-team').style.color=r.teamColor||'#fff';
    $('sp-price').textContent=Bus.fmtL(r.priceL);
  } else {
    $('sp-sub').textContent = r.kind==='unsold' ? 'went unsold' : 'set aside — will return later';
  }

  const el=$('soldsplash');
  el.classList.add('show');
  clearTimeout(splashT);
  splashT=setTimeout(()=>{ el.classList.remove('show'); }, sold?4500:3000); // then back to auction page
}

function roleLabel(p){return p.role||'';}

function initials(name){ return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'; }
const SIL='<svg viewBox="0 0 24 24" fill="currentColor" style="width:54%;height:54%"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.4 0-9 2.2-9 5.2V22h18v-2.8C21 16.2 16.4 14 12 14Z"/></svg>';
function fillPhoto(box, name, color, photo){
  // Show the silhouette placeholder first; swap to the real photo only if it loads.
  box.innerHTML='';
  const ph=document.createElement('div');
  ph.className='pavatar sil';
  ph.style.background='linear-gradient(160deg,#182352,#0d1428)';
  ph.style.color=color;
  ph.innerHTML=SIL;
  box.appendChild(ph);
  if(photo){
    const img=new Image();
    img.onload=()=>{ box.innerHTML=''; box.appendChild(img); };
    img.onerror=()=>{ /* keep the placeholder */ };
    img.src=photo;
  }
}
function setPhoto(p, color){ fillPhoto($('pphoto'), p.name, color||'#3a4a80', p.photo); }

function renderTeams(s){
  const lead=s.bidding?s.bidding.leadingTeamId:null;
  $('teams').innerHTML=s.teams.map(t=>{
    const c=Bus.esc(t.color||'#888');
    return `
    <div class="tcard ${t.teamId===lead?'lead':''}" style="--tc:${c}">
      <div class="tn"><span class="swatch" style="background:${c};color:${c}"></span>${Bus.esc(t.name)}</div>
      <div class="rem mono">${Bus.fmtL(t.remaining)}</div>
      <div class="sub">${t.count} players · ${t.overseas} os · spent ${Bus.fmtL(t.spent)}</div>
    </div>`;}).join('');
}

// smooth local timer tick between server heartbeats
let endsAt=null,dur=0;
function tick(){
  const t=snap&&snap.timer;
  if(t&&t.running&&t.remainingMs>0){ endsAt=Date.now()+t.remainingMs; dur=t.durationMs; }
  else if(!(t&&t.running)){ endsAt=null; }
}
let lastSec=null;
setInterval(()=>{
  const ring=$('ring'),num=$('ringnum');
  if(endsAt){
    const rem=Math.max(0,endsAt-Date.now());
    const sec=Math.ceil(rem/1000);
    num.textContent=sec;
    ring.style.setProperty('--p',dur?(rem/dur*100):0);
    ring.style.filter = sec<=5 ? 'drop-shadow(0 0 12px #e63946)' : 'none';
    if(sec!==lastSec){
      if(sec<=5 && sec>0) SFX.tick();
      else if(sec===0 && lastSec>0) SFX.hooter();
      lastSec=sec;
    }
  } else { num.textContent='—'; ring.style.setProperty('--p',0); ring.style.filter='none'; lastSec=null; }
},100);

// load category colors
Bus.getJSON('/api/players').then(d=>{window.__cats=d.cats;if(snap)render(snap);});
Bus.connect(render, on=>Bus.connBadge(on));
</script>
